<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nova AI</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px system-ui,Roboto,sans-serif;background:#0c1220;color:#eef4fa}#app{height:100dvh;display:flex;flex-direction:column}header{background:#151f30;border-bottom:1px solid #33435b;padding:16px;display:flex;align-items:center;justify-content:space-between}header b{font-size:20px;color:#71ead5}button{border:0;border-radius:10px;padding:10px 13px;background:#24364e;color:white;font:inherit}main{flex:1;overflow:auto;padding:15px}.bubble{padding:12px 14px;border-radius:17px;max-width:87%;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;background:#1b293d}.mine{margin-left:auto;background:#12584c}.intro{text-align:center;margin:12vh auto 1em;color:#a7b8c9}.intro strong{display:block;font-size:32px;color:#71ead5}.composer{display:flex;gap:8px;background:#151f30;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}textarea{flex:1;min-width:0;height:48px;max-height:110px;resize:none;background:#0e1727;color:white;border:1px solid #394c64;border-radius:12px;padding:12px;font:inherit}#send{background:#5fdec7;color:#082b25;font-weight:bold}#banner{font-size:12px;padding:7px;text-align:center;background:#2b241c;color:#ffe0a1}#settingsPanel{display:none;position:absolute;inset:0;background:#0a1220ef;align-items:center;justify-content:center;padding:20px}#settingsPanel.show{display:flex}#panel{background:#1b293d;border-radius:15px;padding:22px;width:100%}#backend{width:100%;background:#0d1726;border:1px solid #4b5970;color:white;font:inherit;padding:12px;border-radius:10px}small{color:#aab7c6}#panel button{margin-top:15px}
</style></head><body><div id="app"><header><b>✦ Nova AI</b><div><button id="newChat">New</button> <button id="settings">⚙</button></div></header><main id="messages"><div id="intro" class="intro"><strong>✦</strong><h2>How can I help?</h2><p>Your Android AI chatbot</p></div></main><div id="banner">Offline demo • Connect your own backend for AI replies</div><div class="composer"><textarea id="prompt" placeholder="Ask Nova AI..." aria-label="Your message"></textarea><button id="send">Send</button></div></div>
<div id="settingsPanel"><div id="panel"><h2>AI Backend</h2><p><small>For real AI replies, enter the HTTPS URL of your trusted Nova AI backend, or the local IP of your development server on Wi-Fi. Never enter an OpenAI API key here.</small></p><input id="backend" placeholder="http://192.168.1.5:3000" spellcheck="false"><div><button id="save">Save</button> <button id="cancel">Cancel</button></div></div></div>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id),list=el('messages'),prompt=el('prompt');let busy=false,history=[],backend=localStorage.getItem('novaBackend')||'';const banner=()=>el('banner').textContent=backend?'Backend: '+backend:'Offline demo • Connect your own backend for AI replies';
function bubble(role,content){el('intro')?.remove();const node=document.createElement('div');node.className='bubble'+(role==='user'?' mine':'');node.textContent=content;list.append(node);list.scrollTop=list.scrollHeight;return node}
function demo(q){if(/math|derivative|calculus/i.test(q))return 'DEMO: The derivative of x² is 2x. To receive full AI answers, connect your backend in Settings.';return 'DEMO: I received your message. Open Settings to connect an AI backend for real replies.'}
async function send(){const q=prompt.value.trim();if(!q||busy)return;prompt.value='';bubble('user',q);history.push({role:'user',content:q});const output=bubble('assistant','Thinking...');busy=true;el('send').disabled=true;try{let answer;if(!backend){answer=demo(q)}else{const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),60000);try{const r=await fetch(backend.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-20)}),signal:abort.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'Backend error');if(typeof data.reply!=='string')throw Error('Missing AI reply');answer=data.reply}finally{clearTimeout(timer)}}output.textContent=answer;history.push({role:'assistant',content:answer})}catch(e){output.textContent='Connection error: '+e.message+'\nCheck backend URL and internet/Wi-Fi.';history.pop()}finally{busy=false;el('send').disabled=false;list.scrollTop=list.scrollHeight}}
el('send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});el('newChat').onclick=()=>{history=[];list.innerHTML='<div id="intro" class="intro"><strong>✦</strong><h2>New chat</h2><p>What would you like to ask?</p></div>'};el('settings').onclick=()=>{el('backend').value=backend;el('settingsPanel').classList.add('show')};el('cancel').onclick=()=>el('settingsPanel').classList.remove('show');el('save').onclick=()=>{const v=el('backend').value.trim().replace(/\/$/,'');if(v&&!/^https?:\/\/[A-Za-z0-9.:[\]-]+$/.test(v)){alert('Enter a backend URL with no path, e.g. http://192.168.1.5:3000');return}backend=v;localStorage.setItem('novaBackend',backend);el('settingsPanel').classList.remove('show');banner()};banner()})();
</script></body></html>
